{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" | default "" -}}
{{- $caption := .Get "caption" -}}

<figure class="project-image">
  <img
    src="{{ $src | relURL }}"
    alt="{{ $alt }}"
    loading="lazy"
  >
  {{- with $caption }}
  <figcaption>
    <em>{{ . }}</em>
  </figcaption>
  {{- end }}
</figure>
